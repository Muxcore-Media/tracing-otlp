services:
  tracing-otlp:
    build:
      context: ../..
      dockerfile: _mvp/dockerfiles/module.Dockerfile
      args:
        MODULE: tracing-otlp
    ports:
      - "9613:9613"
    environment:
      TRACING_GRPC_ADDR: "127.0.0.1:9613"
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: tracing-otlp
    # No OTLP collector bundled — spans log via slog unless you set OTEL_EXPORTER_OTLP_ENDPOINT
    # and point at your own Tempo/Jaeger/collector service.
